{% assign author_name = page.author_name | default: site.owner.name %}
<aside class="author" aria-label="Tác giả">
    {% capture avatar_alt %}Ảnh của {{ author_name }}{% endcapture %}{% include picture.html src="avatar.jpg" alt=avatar_alt sizes="64px" %}
    <div>
        <p class="author-name">{{ author_name }}</p>
        <p class="author-bio">Hơn 10 năm làm web, từ PHP tới DevOps rồi Fullstack. <a href="{{ site.url }}/about">Đọc chuyện của tui</a></p>
    </div>
</aside>
